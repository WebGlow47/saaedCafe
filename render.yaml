services:
  - type: web
    name: saad-cafe
    runtime: static
    buildCommand: echo "Saad Cafe static site ready"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
